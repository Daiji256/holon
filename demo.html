<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holon Demo</title>
  <style>
    @font-face {
      font-family: 'Holon Sans';
      src: url('fonts/full/HolonSans-Variable.woff2') format('woff2');
      font-weight: 100 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Holon Sans';
      src: url('fonts/full/HolonSans-Italic-Variable.woff2') format('woff2');
      font-weight: 100 700;
      font-style: italic;
    }
    @font-face {
      font-family: 'Holon Mono';
      src: url('fonts/full/HolonMono-Variable.woff2') format('woff2');
      font-weight: 100 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Holon Mono';
      src: url('fonts/full/HolonMono-Italic-Variable.woff2') format('woff2');
      font-weight: 100 700;
      font-style: italic;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      select, .preview { background: #1a1a1a; color: #eee; border-color: #333; }
      .controls { background: #1a1a1a; border-color: #333; }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .controls label { display: flex; align-items: center; gap: 6px; }
    select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; }
    .val { min-width: 32px; font-variant-numeric: tabular-nums; }

    .preview {
      font-family: 'Holon Sans', sans-serif;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 24px;
      min-height: 400px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .preview.vertical {
      writing-mode: vertical-rl;
      height: 480px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label>Family:
      <select id="family">
        <option value="'Holon Sans', sans-serif" selected>Holon Sans</option>
        <option value="'Holon Mono', monospace">Holon Mono</option>
      </select>
    </label>

    <label>Weight:
      <input type="range" id="weight" min="100" max="700" step="10" value="400">
      <span id="weight-val" class="val">400</span>
    </label>

    <label>Grade:
      <input type="range" id="grad" min="-100" max="100" step="5" value="0">
      <span id="grad-val" class="val">0</span>
    </label>

    <label>Size:
      <input type="range" id="size" min="12" max="64" step="1" value="22">
      <span id="size-val" class="val">22px</span>
    </label>

    <label><input type="checkbox" id="italic"> Italic</label>
    <label><input type="checkbox" id="chws" checked> chws</label>
    <label><input type="checkbox" id="zero"> zero</label>
    <label><input type="checkbox" id="vert"> 縦書き</label>
  </div>

  <div id="preview" class="preview" contenteditable="true" spellcheck="false">あのイーハトーヴォのすきとおった風、夏でも底に冷たさをもつ青いそら。
The quick brown fox jumps over the lazy dog. 0123456789
「新・東京（港区）」：【速報】——和文イタリックと約物ツメの検証。

┌────────────────────────┬─────────────┐
│ Package: @holon/family │ Status: OK  │
└────────────────────────┴─────────────┘</div>

  <script>
    const p = document.getElementById('preview');
    const f = document.getElementById('family');
    const w = document.getElementById('weight');
    const wv = document.getElementById('weight-val');
    const g = document.getElementById('grad');
    const gv = document.getElementById('grad-val');
    const s = document.getElementById('size');
    const sv = document.getElementById('size-val');
    const it = document.getElementById('italic');
    const ch = document.getElementById('chws');
    const z = document.getElementById('zero');
    const v = document.getElementById('vert');

    function update() {
      p.style.fontFamily = f.value;
      p.style.fontSize = s.value + 'px';
      p.style.fontStyle = it.checked ? 'italic' : 'normal';
      p.style.fontVariationSettings = `'wght' ${w.value}, 'GRAD' ${g.value}`;

      const feats = [];
      if (ch.checked) feats.push(v.checked ? '"vchw" 1' : '"chws" 1');
      if (z.checked) feats.push('"zero" 1');
      p.style.fontFeatureSettings = feats.length ? feats.join(', ') : 'normal';

      p.classList.toggle('vertical', v.checked);
      wv.textContent = w.value;
      gv.textContent = g.value;
      sv.textContent = s.value + 'px';
    }

    [f, w, g, s, it, ch, z, v].forEach(el => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
